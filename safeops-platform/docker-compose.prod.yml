# SafeOps — pilot deployment.
#
#   cp .env.prod.example .env.prod        # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile tls up -d --build
#
# Deliberately one instance of the API. The reminder sweeps run inside it, and two
# instances would each sweep; the dedupe makes that harmless rather than duplicating, but
# a pilot has no reason to take the risk. Uploaded evidence is on a named volume for the
# same reason it is not on the container filesystem: it must outlive the container.
#
# ── TLS ──────────────────────────────────────────────────────────────────────
# The `tls` profile runs deploy/Caddyfile, which obtains and renews a real certificate
# automatically. It is a profile rather than a plain service because terminating TLS
# somewhere else is a legitimate choice: a cloud load balancer, or an nginx already on the
# host (deploy/nginx-safeops.conf). Omit `--profile tls` and nothing about the rest of the
# stack changes.
#
# Whichever you choose, something in front MUST terminate TLS. The API refuses to boot
# unless APP_PUBLIC_URL is https, because every invitation and reset link carries a
# single-use credential in the URL.

# Every service uses this. Docker's json-file driver is unbounded by default: the API
# writes one line per request, so a busy day or a retry storm fills the disk, and a full
# disk stops PostgreSQL. Three files of 20 MB caps each service at 60 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  db:
    # Pinned by digest; see api/Dockerfile for why and how to re-pin.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    logging: *logging
    # max_connections must exceed what every API instance's pool can ask for, plus room
    # for pg_dump and a psql session during an incident. See connection_limit below.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-safeops}
      # Explicit, because a cluster that inherits a non-UTF8 locale cannot store every
      # character the product accepts, and that is only discovered when someone types one.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - safeops_pgdata:/var/lib/postgresql/data
      # Where pg_dump writes. Mount it somewhere backed up off this host.
      - safeops_backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-safeops}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published. Only the API needs it, and it reaches it over the internal network.

  api:
    # Named so a release can be recorded and returned to: the containers always run
    # `:local`, and deploy/deployment.sh keeps the image it replaced under a dated tag that
    # deploy/rollback.sh points `:local` back at. SAFEOPS_API_IMAGE names a registry
    # repository when releases are pulled rather than built (see docs/PRODUCTION_PLATFORM.md).
    image: ${SAFEOPS_API_IMAGE:-safeops-api}:${SAFEOPS_VERSION:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      PORT: 4000
      # connection_limit is explicit on purpose. Prisma otherwise sizes the pool from the
      # host's CPU count (cores × 2 + 1), so the same image quietly opens 17 connections on
      # an 8-core box and 65 on a 32-core one — enough for two instances to exhaust
      # PostgreSQL's 100 and lock everyone out. pool_timeout bounds how long a request
      # waits for a free connection instead of hanging.
      # Defaults to the database container beside it, and can be replaced wholesale by
      # setting DATABASE_URL in .env.prod — which is what a managed database needs, since
      # its host, port and credentials have nothing to do with the values above.
      #
      # A managed URL must carry sslmode=require (or verify-full with the provider's CA):
      # the connection crosses a real network, and the API refuses to start in production
      # without it. See the check in api/src/env.ts.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safeops}?schema=public&connection_limit=${DB_POOL_SIZE:-20}&pool_timeout=15}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?run npm run keygen}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?run npm run keygen}
      CORS_ORIGINS: ${CORS_ORIGINS:?set the web origin}
      # Required in production and validated at boot: every invitation and report link is
      # built from it. Without it the container exits immediately rather than sending
      # people links to localhost.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set the public address users visit}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Email. All optional: with none of it set, reports are still generated and
      # downloadable and invitations still work by passing the link on by hand. Nothing is
      # ever recorded as emailed when it was not. REPORT_EMAIL_FROM becomes required as
      # soon as a transport is set, and the API refuses to boot without it.
      REPORT_EMAIL_FROM: ${REPORT_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # Background jobs run in the worker service below, not in the API. Set 'true' only
      # when running the API without a worker (a single-process install).
      SCHEDULER_ENABLED: 'false'
      SCHEDULER_INTERVAL_MIN: ${SCHEDULER_INTERVAL_MIN:-15}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-3000}
      # The integration API's own ceiling, per key rather than per address.
      API_KEY_RATE_LIMIT_PER_MIN: ${API_KEY_RATE_LIMIT_PER_MIN:-1000}
      # Seals webhook signing secrets so they can be read back to sign each payload.
      # Optional: without it the rest of the product works and webhooks cannot be created,
      # with an explanation rather than a failure. Generate with: npm run keygen
      WEBHOOK_SECRET_KEY_B64: ${WEBHOOK_SECRET_KEY_B64:-}
      # Seals authenticator secrets for multi-factor sign-in. Optional: without it MFA
      # cannot be set up, with an explanation. Generate with: npm run keygen
      MFA_SECRET_KEY_B64: ${MFA_SECRET_KEY_B64:-}
      # The restricted database login the API and worker run as, with row-level security in
      # force. DATABASE_URL stays the schema owner, used only for migrations. Optional, but
      # without it the service runs as the Postgres superuser. Generate with: npm run keygen
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      # Bearer token for GET /metrics (Prometheus). Unset: the endpoint does not exist.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Which peers may set X-Forwarded-For. The default covers Caddy on this private
      # compose network and refuses the header from anything on a public address, so a
      # client cannot name its own rate-limit bucket or audit-trail entry. It does not
      # need changing for Cloudflare: Cloudflare talks to Caddy, and Caddy is still the
      # peer this process sees. See docs/CLOUDFLARE.md.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      # The business day: when "today" and "this month" roll over. Inherited by the worker,
      # whose reminders count days from it.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kuching}
      # Proves a request came through Caddy. Required in production whenever TRUST_PROXY is
      # not `false`, because behind Docker the address alone cannot establish it: published
      # ports are source-NATed to the bridge gateway, which the trust list accepts. Without
      # it a caller reaching the API directly can choose its own rate-limit bucket and the
      # address recorded in the audit trail. Generate with `openssl rand -hex 32`.
      PROXY_TOKEN: ${PROXY_TOKEN:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - safeops_uploads:/data/uploads
    # Bound to loopback by default. With a proxy in front, publishing these on 0.0.0.0
    # would expose a plaintext HTTP port on the public interface alongside the HTTPS one,
    # and anything reaching it bypasses TLS and HSTS entirely - the redirect only helps
    # people who arrive on :80. Caddy reaches these over the compose network, not via a
    # published port, so the default costs nothing. Set BIND_HOST=0.0.0.0 only if the
    # thing terminating TLS is on another host.
    ports:
      - '${BIND_HOST:-127.0.0.1}:${API_PORT:-4000}:4000'

  # Reminder sweeps, scheduled reports and webhook delivery. Same image as the API, a
  # different command, no published port. Split out so API replicas scale on traffic and
  # background work on data, and so a slow sweep never shares an event loop with requests.
  # A second worker is safe (each pass takes a Postgres advisory lock) but only stands by.
  worker:
    # The API's image, by name, so a deploy or rollback moves both together. Before this the
    # worker was built separately and a rollback could leave it on the newer code.
    image: ${SAFEOPS_API_IMAGE:-safeops-api}:${SAFEOPS_VERSION:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    logging: *logging
    depends_on:
      # The API container applies migrations on start; the worker waits for it.
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      SCHEDULER_ENABLED: 'true'
      # Sweeps run one after another, so the worker needs a handful of connections, not the
      # API's pool. Applied on top of DATABASE_URL, a managed one included.
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-5}
    # A stop waits for a report or sweep already in flight (up to 25 s) before exiting.
    stop_grace_period: 30s
    volumes:
      # Scheduled reports write their PDFs here, and the API serves them from here.
      - safeops_uploads:/data/uploads
    # The image's HEALTHCHECK probes the API's HTTP port, which the worker does not have.
    # Healthy while jobs keep being recorded: see api/src/cli/workerHealth.ts.
    healthcheck:
      test: ['CMD', 'node', 'dist/cli/workerHealth.js']
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3

  web:
    image: ${SAFEOPS_WEB_IMAGE:-safeops-web}:${SAFEOPS_VERSION:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the bundle at build time, so changing it requires a rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set the API URL the browser will call}
    logging: *logging
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Substituted into the Content-Security-Policy at container start. The browser calls
      # the API on another origin, so connect-src has to name it; deriving it from the same
      # value the bundle was built against keeps the two from drifting apart.
      CSP_CONNECT_SRC: ${VITE_API_BASE_URL}
      # Substituted into /sitemap.xml, which needs absolute URLs. Same variable the API builds
      # invitation and report links from, so the sitemap cannot name a different host than the
      # one people are actually sent to.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set the public address users visit}
    ports:
      - '${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080'

  # Opt-in: only starts with `--profile tls`. See the note at the top of this file.
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    logging: *logging
    depends_on: [api, web]
    environment:
      # Empty defaults, deliberately - NOT `${VAR:?...}`.
      #
      # Compose interpolates every service in the file regardless of which profiles are
      # active, so a required-variable guard here makes `ps`, `logs`, `down` and `up` all
      # fail for anyone terminating TLS elsewhere. That breaks the promise this profile is
      # built on: omit it and nothing else changes. Found by running it.
      #
      # Nothing is lost. An empty site address is an invalid Caddyfile, so starting this
      # profile unconfigured still fails immediately and says so - verified by running it
      # with the variables unset.
      # Sent to the API as X-SafeOps-Proxy so it can tell this proxy from a client.
      PROXY_TOKEN: ${PROXY_TOKEN:-}
      SAFEOPS_APP_DOMAIN: ${SAFEOPS_APP_DOMAIN:-}
      SAFEOPS_API_DOMAIN: ${SAFEOPS_API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      # These two are genuinely public: :80 exists only to redirect to :443.
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key. Losing this volume means re-issuing
      # on next start, which counts against Let's Encrypt rate limits.
      - safeops_caddy_data:/data
      - safeops_caddy_config:/config

volumes:
  safeops_pgdata:
  safeops_uploads:
  safeops_backups:
  safeops_caddy_data:
  safeops_caddy_config:
