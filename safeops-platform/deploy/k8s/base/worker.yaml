# Reminder sweeps, scheduled reports, webhook delivery. One replica: each pass takes a
# Postgres advisory lock, so a second would only stand by. Recreate, so a deploy never has
# old and new code sweeping side by side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeops-worker
  labels: { app.kubernetes.io/name: safeops-worker }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: safeops-worker }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: safeops-worker }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: safeops-api
          command: [node, dist/worker.js]
          envFrom:
            - configMapRef: { name: safeops-config }
            - secretRef: { name: safeops-secrets }
          env:
            - { name: SCHEDULER_ENABLED, value: "true" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
          # Healthy while jobs keep being recorded (api/src/cli/workerHealth.ts).
          livenessProbe:
            exec: { command: [node, dist/cli/workerHealth.js] }
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
      # A stop waits for a sweep or report in flight (up to 25 s).
      terminationGracePeriodSeconds: 35
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: safeops-uploads }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
