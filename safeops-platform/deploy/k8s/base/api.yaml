apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeops-api
  labels: { app.kubernetes.io/name: safeops-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: safeops-api }
  # Zero-downtime: a new pod must be ready before an old one goes.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: safeops-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas over nodes, so one node failing does not take the API with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: safeops-api }
      # Migrations, then the restricted database login - as the schema owner, before the new
      # pods take traffic. Prisma takes an advisory lock, so two pods starting at once is safe.
      initContainers:
        - name: migrate
          image: safeops-api
          command: [sh, -c, 'npx prisma migrate deploy && node dist/cli/dbAppRole.js']
          envFrom:
            - configMapRef: { name: safeops-config }
            - secretRef: { name: safeops-secrets }
          env:
            # The root filesystem is read-only; npm's cache and logs go to the tmp volume.
            - { name: NPM_CONFIG_CACHE, value: /tmp/.npm }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      containers:
        - name: api
          image: safeops-api
          # Straight to the server: the init container has already migrated.
          command: [node, dist/server.js]
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: safeops-config }
            - secretRef: { name: safeops-secrets }
          env:
            - { name: SCHEDULER_ENABLED, value: "false" }   # the worker runs the schedule
          securityContext: *restricted
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Out of the load balancer while the database is unreachable...
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # ...but only restarted if the process itself stops answering.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Endpoints are removed asynchronously; keep serving briefly so in-flight
            # requests from load balancers that have not yet noticed still succeed.
            preStop:
              exec: { command: [sleep, "10"] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
      # server.ts drains for up to 25 s on SIGTERM; this covers the preStop sleep plus that.
      terminationGracePeriodSeconds: 45
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: safeops-uploads }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: safeops-api
  labels: { app.kubernetes.io/name: safeops-api }
spec:
  selector: { app.kubernetes.io/name: safeops-api }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: safeops-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: safeops-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: safeops-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: safeops-api }
