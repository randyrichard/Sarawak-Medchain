apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeops-web
  labels: { app.kubernetes.io/name: safeops-web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: safeops-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: safeops-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: safeops-web
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: safeops-web-config }
          # The image's nginx master starts as root and drops to the nginx user, and the
          # entrypoint writes the CSP into /etc/nginx at start - so the root filesystem stays
          # writable here. Moving to an unprivileged nginx base would allow the restricted
          # profile the API runs under (docs/PRODUCTION_PLATFORM.md, hardening backlog).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, SETGID, SETUID] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: safeops-web-config
data:
  # Must name the API origin the bundle was built against (VITE_API_BASE_URL).
  CSP_CONNECT_SRC: https://api.REPLACE_ME.example.com
  APP_PUBLIC_URL: https://app.REPLACE_ME.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: safeops-web
  labels: { app.kubernetes.io/name: safeops-web }
spec:
  selector: { app.kubernetes.io/name: safeops-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: safeops-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: safeops-web }
