# SafeOps on Kubernetes - the base. Apply an overlay, not this directly:
#   kubectl apply -k deploy/k8s/overlays/production
# See deploy/k8s/README.md for what you must supply (database, secrets, ingress, storage).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: safeops
labels:
  - pairs:
      app.kubernetes.io/part-of: safeops
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - uploads-pvc.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  - policies.yaml
