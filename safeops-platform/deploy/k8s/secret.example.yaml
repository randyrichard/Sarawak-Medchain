# The secrets SafeChain needs, as a Kubernetes Secret named `safeops-secrets`.
#
# Do NOT commit a filled-in copy. Create it out of band - from a secrets manager through the
# External Secrets Operator or Sealed Secrets, or once by hand:
#   kubectl -n safeops create secret generic safeops-secrets --from-env-file=secrets.env
# Values are the same as in .env.prod; `npm run keygen` (in api/) generates the keys.
apiVersion: v1
kind: Secret
metadata:
  name: safeops-secrets
  namespace: safeops
type: Opaque
stringData:
  # The schema owner: migrations only. Managed Postgres with point-in-time recovery is
  # strongly recommended over running Postgres in the cluster.
  DATABASE_URL: postgresql://safeops_owner:CHANGE_ME@your-db-host:5432/safeops?sslmode=require
  # The restricted login the API and worker run as (row-level security). Created by the
  # migrate init container. Letters/digits, 16+.
  APP_DB_PASSWORD: CHANGE_ME
  JWT_PRIVATE_KEY_B64: CHANGE_ME
  JWT_PUBLIC_KEY_B64: CHANGE_ME
  MFA_SECRET_KEY_B64: CHANGE_ME
  WEBHOOK_SECRET_KEY_B64: CHANGE_ME
  METRICS_TOKEN: CHANGE_ME
  # Must also be sent by the ingress as the X-SafeOps-Proxy request header - see README.
  PROXY_TOKEN: CHANGE_ME
  # One of: RESEND_API_KEY, or SMTP_URL
  RESEND_API_KEY: ""
