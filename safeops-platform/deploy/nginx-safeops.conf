# SafeChain reverse proxy — nginx.
#
# Use this if you already run nginx. Otherwise prefer deploy/Caddyfile, which handles
# certificates and the HTTP redirect without any of this being written by hand.
#
#   sudo cp deploy/nginx-safeops.conf /etc/nginx/sites-available/safeops
#   sudo ln -s /etc/nginx/sites-available/safeops /etc/nginx/sites-enabled/safeops
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates first, with certbot:
#   sudo certbot certonly --nginx -d app.safechain.example -d api.safechain.example
#
# Replace the two hostnames. They MUST share a registrable domain: the refresh cookie is
# SameSite=Strict, so a pair on different registrable domains will silently fail to keep
# anyone signed in.

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
# One server block for both names. The ACME path is served over HTTP because that is how
# the challenge works; everything else is redirected permanently.
server {
    listen 80;
    listen [::]:80;
    server_name app.safechain.example api.safechain.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Web app ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.safechain.example;

    ssl_certificate     /etc/letsencrypt/live/app.safechain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.safechain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SafeOpsSSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # `always` matters — without it these are omitted on error responses, which is exactly
    # when a browser is most likely to be doing something you did not intend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.safechain.example;

    ssl_certificate     /etc/letsencrypt/live/api.safechain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.safechain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SafeOpsSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;

    server_tokens off;

    # Uploads: 10 MB per file, five per request. 60 MB leaves room for the multipart
    # envelope without letting an unbounded body through.
    client_max_body_size 60M;

    # NOTE: no CORS headers here on purpose. The API holds the allow-list and refuses
    # unknown origins itself. Adding `add_header Access-Control-Allow-Origin` would either
    # duplicate the header — which browsers reject — or override a deliberate refusal.

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy`, so this is what makes req.ip the real client. Per-IP
        # rate limiting depends on it: without this every user shares one bucket and the
        # 600/min ceiling applies to the whole customer at once.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The refresh cookie is issued with Secure and SameSite=Strict by the API. Nothing
        # here rewrites it — proxy_cookie_flags would mask a misconfigured API rather than
        # surface it.

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;   # so a slow upload streams rather than buffering to disk
    }

    # Health checks bypass the access log to keep it readable. Readiness is the one an
    # upstream health check should use — it reports on the database, not just the process.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:4000/health/ready;
        access_log off;
    }
}
