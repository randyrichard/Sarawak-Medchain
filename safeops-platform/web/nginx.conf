# Serves the built SPA.
#
# Two things this has to get right: a client-side router means any path must return
# index.html rather than 404, and the hashed asset filenames mean those files can be
# cached indefinitely while index.html must never be.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is a separate origin with its own CORS allow-list; nothing is proxied here.
    # Everything else is same-origin and self-hosted, so the policy can be tight.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed by the build, so a given URL's bytes never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Must not be cached: it names the current asset bundle, so a stale copy pins a
    # browser to a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: /incidents/abc is a route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
